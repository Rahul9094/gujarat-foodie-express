<svg width="1054" height="1492" viewBox="0 0 1054 1492" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&amp;family=Playfair+Display:ital,wght@1,700&amp;display=swap');
      .text-red { fill: #E31E24; }
      .text-navy { fill: #002147; }
      .text-white { fill: #FFFFFF; }
      .font-sans { font-family: 'Montserrat', Arial, sans-serif; }
      .font-serif { font-family: 'Playfair Display', 'Times New Roman', serif; }
      .bold { font-weight: 700; }
      .heavy { font-weight: 800; }
      .italic { font-style: italic; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1054" height="1492" fill="#FFFFFF"/>
  
  <!-- Subtle Grey Accents -->
  <path d="M0 0 H1054 V400 L0 300 Z" fill="#F8F9FA"/>

  <!-- Logo & Slogan -->
  <image x="40" y="40" width="410" height="110" xlink:href="data:image/png;base64,REPLACE_LOGO"/>
  <text x="160" y="165" class="font-sans text-red bold" font-size="20">Strong Bags. <tspan class="text-navy">Stronger Future.</tspan></text>

  <!-- "You're Invited!" (Top Right) -->
  <text x="530" y="100" class="font-serif text-red italic" font-size="44">You're</text>
  <text x="580" y="170" class="font-sans text-navy heavy" font-size="80" letter-spacing="-2">INVITED!</text>
  <line x1="620" y1="190" x2="880" y2="190" stroke="#E31E24" stroke-width="2"/>
  <circle cx="750" cy="190" r="3" fill="#E31E24"/>

  <!-- Left Column Text -->
  <g transform="translate(60, 260)">
    <text class="font-sans text-navy bold" font-size="24">JOIN US AT</text>
    <line y1="12" y2="12" x2="160" stroke="#E31E24" stroke-width="2"/>
    
    <text y="90" class="font-sans text-navy heavy" font-size="64">PACK EXPO</text>
    <text y="170" class="font-sans text-navy heavy" font-size="64">INTERNATIONAL</text>
    
    <rect y="210" width="380" height="60" rx="30" fill="#002147"/>
    <text x="190" y="252" class="font-sans text-white bold" font-size="32" text-anchor="middle" letter-spacing="3">CHICAGO 2026</text>
    
    <g transform="translate(0, 330)">
        <text class="font-sans text-navy" font-size="22" line-height="1.5">
            <tspan x="0" dy="0">We cordially invite you to visit us at</tspan>
            <tspan x="0" dy="35" class="text-red bold">PACK EXPO INTERNATIONAL 2026</tspan>
            <tspan x="0" dy="35">and explore our wide range of</tspan>
            <tspan x="0" dy="35">high-quality PP woven packaging</tspan>
            <tspan x="0" dy="35">solutions for every industry.</tspan>
        </text>
    </g>
  </g>

  <!-- Visit Us Banner -->
  <g transform="translate(0, 750)">
    <path d="M0 0 H420 L450 40 L420 120 H0 Z" fill="#E31E24"/>
    <path d="M0 0 H320 L350 40 L320 120 H0 Z" fill="#002147"/>
    <text x="40" y="38" class="font-sans text-white bold" font-size="24">VISIT US AT</text>
    
    <g transform="translate(0, 60)">
        <text x="100" y="30" class="font-sans text-white" font-size="20" text-anchor="middle">HALL NO.</text>
        <text x="100" y="85" class="font-sans text-white bold" font-size="52" text-anchor="middle">S-4004</text>
        <line x1="200" y1="20" x2="200" y2="90" stroke="#FFFFFF" opacity="0.5"/>
        <text x="300" y="30" class="font-sans text-white" font-size="20" text-anchor="middle">BOOTH NO.</text>
        <text x="300" y="85" class="font-sans text-white bold" font-size="52" text-anchor="middle">B-126</text>
    </g>
  </g>

  <!-- Right Information Box -->
  <g transform="translate(460, 210)">
    <rect width="480" height="420" rx="40" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M0 40 Q0 0 40 0 H200 L180 180 L0 150 Z" fill="#E1F0FF"/>
    
    <image x="40" y="30" width="110" height="110" xlink:href="data:image/png;base64,REPLACE_PACK_EXPO"/>
    
    <g transform="translate(170, 40)">
        <text class="font-sans text-navy bold" font-size="20">PACK EXPO INTERNATIONAL</text>
        <text y="28" class="font-sans text-red bold" font-size="20">CHICAGO 2026</text>
    </g>
    
    <image x="240" y="90" width="240" height="330" xlink:href="data:image/png;base64,REPLACE_SKYLINE" preserveAspectRatio="xMidYMax slice"/>
    
    <g transform="translate(40, 180)">
        <text class="font-sans text-navy" font-size="18">November 1–4, 2026</text>
        <text y="50" class="font-sans text-navy bold" font-size="18">McCormick Place</text>
        <text y="75" class="font-sans text-navy" font-size="18">Chicago, IL, USA</text>
    </g>
  </g>

  <!-- Product Hero Section -->
  <g transform="translate(450, 600)">
    <image x="50" y="0" width="220" height="320" xlink:href="data:image/png;base64,REPLACE_JUMBO"/>
    <image x="180" y="120" width="140" height="200" xlink:href="data:image/png;base64,REPLACE_BAG_CEMENT"/>
    <image x="300" y="120" width="140" height="200" xlink:href="data:image/png;base64,REPLACE_BAG_SUGAR"/>
    <image x="420" y="120" width="140" height="200" xlink:href="data:image/png;base64,REPLACE_BAG_FERT"/>
    <image x="550" y="140" width="220" height="180" xlink:href="data:image/png;base64,REPLACE_ROLLS"/>
  </g>

  <!-- Icons Row -->
  <g transform="translate(60, 950)">
    <g transform="translate(50, 0)" text-anchor="middle">
        <circle r="35" stroke="#E31E24" stroke-width="1" fill="none"/>
        <text y="60" class="font-sans text-navy bold" font-size="14">PREMIUM QUALITY</text>
    </g>
    <g transform="translate(200, 0)" text-anchor="middle">
        <circle r="35" stroke="#E31E24" stroke-width="1" fill="none"/>
        <text y="60" class="font-sans text-navy bold" font-size="14">GLOBAL PRESENCE</text>
    </g>
    <g transform="translate(350, 0)" text-anchor="middle">
        <circle r="35" stroke="#E31E24" stroke-width="1" fill="none"/>
        <text y="60" class="font-sans text-navy bold" font-size="14">ADVANCED MFG</text>
    </g>
    
    <g transform="translate(50, 120)" text-anchor="middle">
        <circle r="35" stroke="#E31E24" stroke-width="1" fill="none"/>
        <text y="60" class="font-sans text-navy bold" font-size="14">STRICT QUALITY</text>
    </g>
    <g transform="translate(200, 120)" text-anchor="middle">
        <circle r="35" stroke="#E31E24" stroke-width="1" fill="none"/>
        <text y="60" class="font-sans text-navy bold" font-size="14">SUSTAINABLE</text>
    </g>
    <g transform="translate(350, 120)" text-anchor="middle">
        <circle r="35" stroke="#E31E24" stroke-width="1" fill="none"/>
        <text y="60" class="font-sans text-navy bold" font-size="14">ON TIME DELIVERY</text>
    </g>
  </g>

  <!-- Solutions Section -->
  <g transform="translate(0, 1180)">
    <rect width="1054" height="40" fill="#002147"/>
    <text x="527" y="28" class="font-sans text-white bold" font-size="18" text-anchor="middle">OUR PACKAGING SOLUTIONS</text>
    
    <g transform="translate(80, 70)">
        <g transform="translate(0, 0)" text-anchor="middle">
            <image x="-60" width="120" height="120" xlink:href="data:image/png;base64,REPLACE_SOL_FIBC"/>
            <text y="150" class="font-sans text-navy bold" font-size="12">FIBC / JUMBO BAGS</text>
        </g>
        <g transform="translate(160, 0)" text-anchor="middle">
            <image x="-60" width="120" height="120" xlink:href="data:image/png;base64,REPLACE_SOL_CEMENT"/>
            <text y="150" class="font-sans text-navy bold" font-size="12">CEMENT BAGS</text>
        </g>
        <g transform="translate(320, 0)" text-anchor="middle">
            <image x="-60" width="120" height="120" xlink:href="data:image/png;base64,REPLACE_SOL_SUGAR"/>
            <text y="150" class="font-sans text-navy bold" font-size="12">SUGAR BAGS</text>
        </g>
        <g transform="translate(480, 0)" text-anchor="middle">
            <image x="-60" width="120" height="120" xlink:href="data:image/png;base64,REPLACE_SOL_FERT"/>
            <text y="150" class="font-sans text-navy bold" font-size="12">FERTILIZER BAGS</text>
        </g>
        <g transform="translate(640, 0)" text-anchor="middle">
            <image x="-60" width="120" height="120" xlink:href="data:image/png;base64,REPLACE_SOL_ROLLS"/>
            <text y="150" class="font-sans text-navy bold" font-size="12">FABRICS &amp; ROLLS</text>
        </g>
        <g transform="translate(800, 0)" text-anchor="middle">
            <image x="-60" width="120" height="120" xlink:href="data:image/png;base64,REPLACE_SOL_TARPAULIN"/>
            <text y="150" class="font-sans text-navy bold" font-size="12">TARPAULIN</text>
        </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(0, 1400)">
    <rect width="1054" height="92" fill="#002147"/>
    <rect x="754" width="300" height="92" fill="#E31E24"/>
    
    <g transform="translate(40, 20)">
        <text class="font-sans text-white" font-size="12">CALL US</text>
        <text y="30" class="font-sans text-white bold" font-size="20">+91 98250 65130</text>
    </g>
    <g transform="translate(280, 20)">
        <text class="font-sans text-white" font-size="12">EMAIL US</text>
        <text y="30" class="font-sans text-white bold" font-size="18">ashish.patel@jaylaxmipolyplast.in</text>
    </g>
    <g transform="translate(560, 20)">
        <text class="font-sans text-white" font-size="12">VISIT OUR WEBSITE</text>
        <text y="30" class="font-sans text-white bold" font-size="18">www.jaylaxmipolyplast.in</text>
    </g>
    
    <g transform="translate(780, 10)">
        <rect width="70" height="70" fill="#FFFFFF"/>
        <image width="70" height="70" xlink:href="data:image/png;base64,REPLACE_QR"/>
        <text x="80" y="30" class="font-sans text-white bold" font-size="18">SCAN TO</text>
        <text x="80" y="55" class="font-sans text-white bold" font-size="18">CONNECT</text>
    </g>
  </g>
</svg>
